#How regularly the faithful must worship, and how favor atrophies when they don't.
#
#IMPORTANT, and this surprises people: these are TICKS OF SERVER UPTIME, measured
#from the world's game-time counter. 20 ticks = 1 second, so 24000 ticks = 20 real
#minutes. They are NOT world days. 'doDaylightCycle false' does not pause them,
#/time set cannot move them, and sleeping through a night does not advance them.
#That is deliberate: game time only ever moves forward, so worship cadence cannot
#be rewound or skipped by changing the clock. Note the counter is server-global,
#so it also advances while a player is logged out.
[cadence]
	#Minimum ticks between offerings to the same god. Default 24000 (20 minutes).
	#A god may override this with 'cooldownTicks' in pantheon.json.
	# Default: 24000
	# Range: > 0
	worshipCooldownTicks = 24000
	#Ticks a player may neglect a god before its favor starts decaying.
	#Default 72000 (one hour). Overridable per god with 'graceTicks'.
	# Default: 72000
	# Range: > 0
	favorGraceTicks = 72000
	#The length of one decay period. Decay is applied once per whole period
	#elapsed. Default 24000.
	# Default: 24000
	# Range: > 1
	favorDecayPeriodTicks = 24000
	#Fraction of accumulated devotion lost per decay period once past the grace
	#period. Overridable per god with 'decayPerPeriod'.
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	favorDecayPerPeriod = 0.1
	#Multiplier applied to favor decay for War and Demi-God groups (PvP currency
	#is scarce, so their favor should bleed slower). 1.0 = same as others.
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	warFavorDecayMultiplier = 0.25
	#Whether killing for a god counts as feeding it, for the purpose of decay.
	#
	#Left FALSE, only an offering handed over at an altar resets the neglect clock.
	#That is how every release up to 1.1.0 behaved, and it has a consequence nobody
	#intended: a god fed ONLY by blood is never stamped at all, so it is skipped by
	#decay forever and its devotion is permanent once earned. Set this true and a
	#qualifying kill postpones decay exactly as an offering does, which makes
	#kill-fed gods decay like every other god.
	#
	#This is left false by default because turning it on will start eroding standing
	#that existing players earned under the old rule. The Patience bar in the worship
	#screen reads honestly either way: with this false, a kill-fed god is shown as
	#'steady' rather than being drawn with a full bar it can never lose.
	killsCountAsWorship = false
	#DEPRECATED, use worshipCooldownTicks instead (1.0 here == 24000 ticks).
	#-1 = unset. Any value >= 0 overrides worshipCooldownTicks and logs a warning,
	#so an existing config keeps its exact behaviour until you migrate it.
	# Default: -1.0
	# Range: -1.0 ~ 1000.0
	worshipCooldownDays = -1.0
	#DEPRECATED, use favorGraceTicks instead (1.0 here == 24000 ticks). -1 = unset.
	# Default: -1.0
	# Range: -1.0 ~ 1000.0
	favorGraceDays = -1.0
	#DEPRECATED, use favorDecayPerPeriod instead. -1 = unset.
	# Default: -1.0
	# Range: -1.0 ~ 1.0
	favorDecayPerDay = -1.0

#Altar strength. The altar arms with an Altar Lectern (or any block in the block tag
##mortalsgods:altar_blocks) standing on a 3x3 of value blocks; its TIER (an offering
#multiplier, 1-4) is then the total VALUE of blocks adorning the temple (the enclosed
#Sanctum), like a church's golden altar. Which blocks count, and for how much, is the
#templeBlockValues list below. These are the value thresholds for tiers 2-4
#(below tier-2 = tier 1).
[altar]
	#Temple ore value needed for Altar Tier 2.
	# Default: 32
	# Range: 1 ~ 100000
	tier2Value = 32
	#Temple ore value needed for Altar Tier 3.
	# Default: 96
	# Range: 1 ~ 100000
	tier3Value = 96
	#Temple ore value needed for Altar Tier 4.
	# Default: 256
	# Range: 1 ~ 100000
	tier4Value = 256
	#Fill a consecrated Sanctum with gentle 'holy' light motes (and a faint chime);
	#denser the higher the altar's tier. Set false for no ambient particles/sound.
	sanctumAmbiance = true
	#Whether a plain vanilla enchanting table still arms an Altar, as it did before
	#1.1.0. Kept true so altars built on older versions keep working. Set false to
	#require the mod's own Altar Lectern. Enchanting tables that another mod swaps in
	#for the vanilla one (Easy Magic does this) count as enchanting tables here too.
	acceptEnchantingTable = true
	#Largest enclosed space that still counts as a Sanctum, in blocks of open air.
	#A room bigger than this reads as open sky and will not consecrate. Raise it if
	#you are building a cathedral; every block of it is flood-filled on each check,
	#so very large values cost server time.
	# Default: 5000
	# Range: 27 ~ 200000
	sanctumMaxVolume = 5000
	#Which blocks adorn a temple, and what each is worth toward the altar's tier.
	#Format: "<block id>=<value>". These are also the only blocks that count for the
	#3x3 base an altar stands on. Add modded storage blocks here freely, for example
	#"create:zinc_block=3". An unparseable or unknown entry is skipped with a warning.
	templeBlockValues = ["minecraft:copper_block=1", "minecraft:iron_block=2", "minecraft:gold_block=4", "minecraft:emerald_block=6", "minecraft:diamond_block=10", "minecraft:netherite_block=24"]

#The living-ruler worship pair (default: the War 'n Nobility Emperor).
[demigod]
	#Master switch for Demi-God worship/rejection and favor theft.
	enableDemigodWar = true
	#WHO can be a Demi-God. List the player names that should ALWAYS be Demi-Gods
	#(the living ruler worshipped at the altar), independent of any other mod. Leave
	#empty to instead use the Emperor set with /mortalsgods emperor set <player> (or a
	#future War 'n Nobility hook). An explicit /mortalsgods emperor always wins; this
	#list is the fallback. Example: ["Steve", "Alex"]. Warborn Realms default = empty
	#(the only Demi-God is the server's Emperor).
	demigodPlayers = []
	#Max Pehkui health-scale bonus the Emperor can reach at full net favor.
	# Default: 2.0
	# Range: 1.0 ~ 10.0
	emperorHealthScaleCap = 2.0
	#Max Pehkui damage-scale bonus at full net favor.
	# Default: 1.5
	# Range: 1.0 ~ 10.0
	emperorStrengthScaleCap = 1.5
	#Max Pehkui motion-scale bonus at full net favor (kept low on purpose).
	# Default: 1.3
	# Range: 1.0 ~ 5.0
	emperorSpeedScaleCap = 1.3
	#Max Pehkui reach-scale bonus at full net favor.
	# Default: 1.5
	# Range: 1.0 ~ 5.0
	emperorReachScaleCap = 1.5
