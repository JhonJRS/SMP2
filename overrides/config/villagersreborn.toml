	# Default: 24000
	# Range: 1200 ~ 240000
	spouseCookingCooldownTicks = 24000
	enableWeddingCutscene = true
	enableFamilyCutscene = true
	# Default: 144000
	# Range: 20 ~ 24000000
	pregnancyDurationTicks = 144000
	enablePregnancyBelly = true
	enableHavingChildren = true
	# Default: 3
	# Range: 1 ~ 20
	familyCharmMaxChildrenPerPair = 3
	enableNaturalFamilySpawns = true
	enableAging = true
	# Default: 144000
	# Range: 20 ~ 24000000
	toddlerDurationTicks = 144000
	# Default: 336000
