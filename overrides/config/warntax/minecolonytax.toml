		# Default: 8090
		# Range: 1024 ~ 65535
		WebAPIPort = 8090
		#API authentication key for secure access. This key must be provided in the 'X-API-Key' header for all requests when authentication is enabled. Generate a strong, random key (recommended: 32+ characters). Example: 'my-super-secret-api-key-12345-abcdef' SECURITY WARNING: Keep this key private! Anyone with this key can access your server data. Default: empty (you must set this to enable authentication)
		WebAPIKey = ""
		#Maximum number of API requests allowed per IP address per minute. Prevents abuse and excessive server load from a single source. Set to 0 to disable rate limiting (not recommended for public servers). Default: 60 (1 request per second average)
		# Default: 60
		# Range: 0 ~ 1000
		WebAPIRateLimitRequestsPerMinute = 60
		#Require API key authentication for all requests. When enabled, requests without a valid 'X-API-Key' header will be rejected with 401 Unauthorized. When disabled, anyone can query the API (use with caution!). SECURITY: Always enable this for public servers. Only disable for local testing. Default: true (authentication required)
		WebAPIRequireAuthentication = true
		#Enable offline player data in API responses. When enabled, the API can return statistics for offline players by scanning player data files. This requires periodic file scanning and caching, which uses more memory and disk I/O. Use the 'includeOffline=true' query parameter to request offline data. PERFORMANCE: Only enable if you need offline player stats on your website. Default: false (online players only)
		WebAPIEnableOfflinePlayers = false
		#How often to refresh the offline player data cache (in minutes). The server will scan player data files at this interval to update offline player statistics. Lower values = more current data but higher disk I/O. Higher values = less load but stale data. Only used when 'WebAPIEnableOfflinePlayers' is true. Recommended: 5-15 minutes for active servers, 30-60 minutes for larger servers. Default: 10 minutes
