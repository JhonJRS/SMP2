	["Building Taxes"."Besiege System"]
		#Enable the besiege system. Allows players to raid active non-primary colonies for tax vassalage.
		EnableBesiegeSystem = true
		#Duration of a besiege raid in minutes. Defenders must survive this long to repel the attack.
		# Default: 20
		# Range: 1 ~ 120
		BesiegeDurationMinutes = 20
		#Hours a player must wait after a besiege attempt (win or loss) before besieging again.
		# Default: 24
		# Range: 0 ~ 168
		BesiegeCooldownHours = 24
		#Fraction of eligible citizens (non-guard, non-deliveryman) converted to militia defenders during a besiege.
		# Default: 0.6
		# Range: 0.0 ~ 1.0
		BesiegeMilitiaPercent = 0.6
		#Percentage of tax income siphoned from the besieged colony to the victor.
		# Default: 30
		# Range: 1 ~ 100
		BesiegeTributePercent = 30
		#How long (hours) the besiege vassalage lasts. Set to 0 for permanent until reclaimed.
		# Default: 72
		# Range: 0 ~ 8760
		BesiegeTributeDurationHours = 72
		#Minimum citizen count required in the target colony before it can be besieged.
		# Default: 5
		# Range: 1 ~ 100
		BesiegeMinColonySize = 5
		#Allow other players to assist the besieger by attacking defenders. They are tracked as allies.
		BesiegeAlliesEnabled = true
		#Mercenaries spawned per colony building. E.g. 0.33 = 1 mercenary per 3 buildings.
		# Default: 0.33
		# Range: 0.0 ~ 5.0
		BesiegeExtraMercenariesPerBuilding = 0.33
		#Maximum number of mercenaries that can be spawned during a single besiege raid.
		# Default: 10
		# Range: 0 ~ 50
		BesiegeMaxMercenaries = 10
		#How far (blocks, from the colony's nearest claimed BORDER — not its center, so irregular polygon claims are handled fairly) the besieging player may roam before it counts as a possible retreat. A besiege is NOT a raid — the attacker is meant to place siege gear outside the walls and chase defenders — so this is deliberately VERY large; only a genuine retreat many chunks out should ever trip it. Straying past this starts the BesiegeRetreatGraceSeconds countdown; returning inside cancels it. Default 1024 = 64 chunks. Also used by conquest wars.
		# Default: 1024
		# Range: 128 ~ 16384
		BesiegePlayerStayRadius = 1024
		#Grace period (seconds) a besieger may spend beyond BesiegePlayerStayRadius before the siege is forfeited as an 'enemy retreated'. During the countdown they get an on-screen warning to return; coming back inside the boundary cancels it, so an accidental step-out never instantly ends the siege. Default 30.
		# Default: 30
		# Range: 5 ~ 600
		BesiegeRetreatGraceSeconds = 30
		#Extra time (seconds) a combatant gets to travel back to the battle after DYING, before the retreat countdown may run again. A death respawns you at your bed or world spawn — usually far outside the battle boundary — so without this the normal BesiegeRetreatGraceSeconds would forfeit the war/siege on your FIRST death and the multi-life system (WarAttackerLives / besiege lives) could never play out. Set to 0 to disable the post-death exemption. Default 180.
		# Default: 180
		# Range: 0 ~ 3600
		BesiegeRespawnReturnSeconds = 180
		#One-shot percentage of the loser's war chest transferred to the winner on besiege resolution. 0 disables siege spoils entirely.
		# Default: 25
		# Range: 0 ~ 100
		BesiegeSpoilPercentOfLoserTreasury = 25
		#[Access] Allow besiegers to open chests/containers in the colony during an ACTIVE siege. false (default): combat-only, no looting.
		BesiegeAllowChestAccess = false
		#[Access] After a siege ends and the colony is vassalized, lock the ORIGINAL OWNER out until they reclaim it? false (default): owner keeps access and only pays tribute.
		VassalLockOutFormerOwner = false
		#[Multiplayer] Minimum distinct besiegers required to CAPTURE the colony. 1 = solo allowed (default).
		# Default: 1
		# Range: 1 ~ 20
		BesiegeMinAttackers = 1
		#[Multiplayer] Split treasury spoils among all participating besiegers on victory. Lead besieger still receives ongoing tribute.
		BesiegeShareSpoils = true
		#[Online] Require besieging player(s) to stay online during a siege. Offline beyond grace = participation cancelled.
		BesiegeRequireOnline = true
		#[Online] Minutes a besieger may stay offline before cancellation (only when BesiegeRequireOnline is true).
		# Default: 5
		# Range: 0 ~ 120
		BesiegeOfflineGraceMinutes = 5
		#[Prep] Minutes the target colony has to answer a declared besiege — Defend it or Buy it off — before the siege begins automatically. Gives defenders time to rally allies.
		# Default: 5
		# Range: 1 ~ 60
		BesiegePrepMinutes = 5
		#[Buy-off] Percentage of the target colony's war chest paid to the besieger to buy off (refuse) a declared besiege, cancelling it with no fight or vassalization.
		# Default: 30
		# Range: 1 ~ 100
		BesiegeBuyoffPercent = 30
		#[Buy-off] Hours the same besieger must wait before besieging the SAME colony again after being bought off — the shakedown breather, so the target can seek allies before they return.
		# Default: 24
		# Range: 0 ~ 720
		BesiegeBuyoffCooldownHours = 24

	["Building Taxes"."Colonist Wartime Protection"]
		#While a colony is under a sanctioned war, besiege, raid, or claiming raid, send its non-guard citizens home to shelter (reuses MineColonies' own raid-shelter behaviour, spawns no raiders). Guards keep defending.
		EnableColonistWartimeShelter = true
		#Stop players from damaging colonists off the books. A player can only harm a colonist if they are a member of that colony or a sanctioned war/besiege/raid is active against it. Vanilla monsters and the environment are unaffected, so natural raids still work.
		EnableColonistKillProtection = true

	["Building Taxes"."Hundred Years Warfare Compatibility"]
		#If Hundred Years Warfare is installed, stop HYW troops from attacking their own commander's and allied colonists (and stop those colonists from retaliating). Enemy colonists remain attackable while a sanctioned War 'n Taxes war, besiege, or raid is active against their colony. No effect if Hundred Years Warfare is not loaded.
		EnableHywFriendlyFireProtection = true

	["Building Taxes"."Experimental Siege Objectives"]
		#EXPERIMENTAL — when enabled, full wars get additional win conditions:
		#the attacker can win by landing N explosive hits on the defender's Town Hall,
		#or by planting and holding a Siege Banner inside the Town Hall.
		#Runs IN PARALLEL with the legacy lives+guards system — first trigger wins.
		EnableExperimentalSiegeObjectives = false
		#Number of counted explosive hits on the Town Hall building required for attacker victory.
		# Default: 5
		# Range: 1 ~ 50
		TownHallExplosiveHitsRequired = 5
		#Per-attacker cooldown (minutes) between counted Town Hall hits.
		# Default: 5
		# Range: 1 ~ 60
		TownHallHitCooldownMinutes = 5
		#Maximum distance (blocks) from the Town Hall centre the attacker may be for an explosion to count.
		# Default: 500
		# Range: 50 ~ 2000
		MaxSiegeRadius = 500
		#Seconds the GLOWING effect is applied to an attacker after they land a counted hit.
		# Default: 30
		# Range: 0 ~ 600
		AttackerGlowSeconds = 30
		#Minutes the attacker must hold a planted Siege Banner inside the Town Hall building for capture.
		# Default: 10
		# Range: 1 ~ 120
		BannerCaptureMinutes = 10

	["Building Taxes"."Mod Compatibility"]
		#Master switch for the Easy Factions integration. When enabled, faction members are
		#granted colony ranks automatically. OFF by default (dormant unless Easy Factions is installed).
		EnableEasyFactionsIntegration = false
		#How often (ticks) to reconcile faction membership into colony ranks. 1200 = 60s.
		# Default: 1200
		# Range: 20 ~ 72000
		EasyFactionsSyncIntervalTicks = 1200
		#Colony rank granted to faction members ('friend' or 'officer').
		EasyFactionsMemberRank = "friend"
		#Grant the colony Officer rank to faction officers.
		PromoteEasyFactionsOfficers = true
		#When true, defer war-damage block restoration to the Explosion't mod (if installed)
		#instead of the built-in WarBlockLedger. OFF by default.
		DeferRestorationToExplosiont = false
