#Debt limit for colony debt. If > 0, colony revenue will not deduct more once the debt reaches this limit (i.e. the tax value won't drop below -DebtLimit). Default 2000 to give military maintenance real consequences.
# Default: 2000
# Range: > 0
DebtLimit = 2000
#Amount of debt added to colony per guard killed when raiding colonies in debt. Only applies when DebtLimit > 0. Raiders get this amount when killing guards in debt colonies. Default: 200.
# Default: 200
# Range: 1 ~ 10000
TaxStealPerGuard = 200

[General]
	#Tax generation interval in minutes
	# Default: 60
	# Range: 1 ~ 1440
	TaxIntervalMinutes = 60
	#Maximum tax revenue a colony can store before it stops generating further taxes. Keep tight to encourage micromanagement and daily engagement.
	# Default: 10000
	# Range: > 1
	MaxTaxRevenue = 10000
	#Enable SDMShop conversion (true = enable, false = disable).
	EnableSDMShopConversion = true
	#SDM-Economy currency id that claimed taxes are paid into. Must match a currency configured on your server (see your SDM-Economy setup). If claims report the currency was not found, set this to a valid id.
	SDMCurrencyName = "sdmcoin"
	#The item name for the custom currency (e.g., 'minecraft:emerald').
	CurrencyItemName = "minecraft:emerald"
	#Logging verbosity level. 0 = MINIMAL (only errors/warnings/critical), 1 = NORMAL (compact summaries), 2 = DEBUG (full verbose output for troubleshooting).
	# Default: 0
	# Range: 0 ~ 2
	LogLevel = 0

["War Settings"]
	#Enable colony ownership transfer when a war is won (true = enable, false = disable).
	EnableColonyTransfer = true
	#If false, war will not toggle any interaction permissions
	EnableWarActions = true
	#Let a player open their OWN corpse (Corpse mod) inside a colony where they have no interaction rights.
	#Dying in a foreign colony is normal here - wars, raids and besieges all happen there - and without this the colony's permissions keep the owner from picking their own inventory back up.
	#Only the corpse's owner is ever exempted: other players' corpses stay subject to the normal colony rules, so a besieger still cannot loot the defenders.
	#No effect unless the Corpse mod is installed.
	EnableCorpseRetrievalInColonies = true
	#If true, war requests must be manually accepted; if false, wars requests will automatically accept.
	WarAcceptanceRequired = true
	#Grace period between declaring wars (minutes)
	# Default: 120
	# Range: 1 ~ 1440
	AttackerGracePeriodMinutes = 120
	#Grace period between raids (minutes)
	# Default: 120
	# Range: 1 ~ 1440
	RaidGracePeriodMinutes = 120
	#Maximum raid duration (minutes)
	# Default: 5
	# Range: 1 ~ 1440
	MaxRaidDurationMinutes = 5
	#Allow players to raid colonies even if the colony owner is offline.
	AllowOfflineRaids = true
	#Penalty percentage applied when a raider is killed by a defender during a raid (0.0 - 1.0)
	# Default: 0.25
	# Range: 0.0 ~ 1.0
	RaidPenaltyPercentage = 0.25
	#Percentage of killed raider's balance transferred to defending colony for owner/officers to claim (0.0 - 1.0)
	# Default: 0.15
	# Range: 0.0 ~ 1.0
	RaidDefenseRewardPercentage = 0.15
	#Percentage of losing players' balance awarded to winning side. Set equal to WarDefeatPercentage to prevent inflation (pool-based: winners get what losers lose). Set to 0.0 to only enable colony transfer (if enabled).
	#Uses SDMShop balance or colony funds based on what's configured.
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	WarVictoryPercentage = 0.2
	#Percentage that each losing player loses from their balance when defeated in war. Should match WarVictoryPercentage to prevent money creation/destruction.
	#Uses SDMShop balance or colony funds based on what's configured.
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	WarDefeatPercentage = 0.2
	#Percentage that all war participants lose from their balance when a war ends in stalemate.
	#Uses SDMShop balance or colony funds based on what's configured.
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	WarStalematePercentage = 0.1
	#[DEPRECATED] Use WarTaxFreezeCycles instead. Duration (in hours) to freeze colony tax generation after a war loss or stalemate.
	#Set to 0 to disable tax freezing. Ignored if WarTaxFreezeCycles > 0.
	# Default: 0
	# Range: 0 ~ 168
	WarTaxFreezeHours = 0
	#Number of tax cycles to skip after a war loss or stalemate. Cycle-based freezing ensures consistent behavior regardless of TaxIntervalMinutes. At default 60min intervals, 3 cycles = 3 hours. Takes precedence over WarTaxFreezeHours.
	# Default: 3
	# Range: 0 ~ 20
	WarTaxFreezeCycles = 3
	#Maximum combined penalty from war exhaustion + active war tax multiplier (0.0-1.0).
	#Prevents excessive penalty stacking. 0.5 = 50% max total penalty.
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	MaxCombinedWarPenaltyPercent = 0.5
	#Minimum tax generation floor as a percentage of base generation (0.0-1.0). After all penalties stack (raid, war exhaustion, reparations, events), tax income will never drop below this fraction. Prevents death spirals where colonies can never recover. 0.30 = colonies always earn at least 30% of their base income.
	# Default: 0.3
	# Range: 0.0 ~ 1.0
	MinTaxGenerationPercent = 0.3
	#When enabled and ENABLE_COLONY_TRANSFER is disabled, winning a war will vassalize the losing colony instead of transferring ownership.
	#The losing colony will pay a percentage of their tax income to the winner for a set duration.
	EnableWarVassalization = true
	#Duration (in hours) that a war vassalization lasts.
	#After this time, the vassalization automatically ends. Set to 0 for permanent vassalization until manually revoked.
	# Default: 168
	# Range: 0 ~ 8760
	WarVassalizationDurationHours = 168
	#Percentage of the vassal colony's tax income paid to the victor as tribute (1-100).
	#Lowered default to 15% to avoid stacking too harshly with other war penalties. Set VassalizationReplacesReparations=true to make tribute the only penalty.
	# Default: 15
	# Range: 1 ~ 100
	WarVassalizationTributePercentage = 15
	#[Spoils] One-time grab applied to the LOSING colony's war chest when a war win results in
	#vassalization (the vassalize-only path, used when EnableColonyTransfer is disabled).
	#Moved from the loser's war chest to the victor's primary colony war chest on victory.
	#Colony-side half of the 'take the huge money' rule. Set 0 to disable.
	# Default: 50
	# Range: 0 ~ 100
	WarVassalizationTreasuryGrabPercent = 50
	#[Spoils] One-time grab applied to the LOSING player's personal wallet when a war win results
	#in vassalization. Percentage of their wallet taken and paid to the victor. Player-side half
	#of the 'take the huge money from the player' rule.
	#Requires an economy mod (SDM-Economy). Set 0 to disable.
	# Default: 25
	# Range: 0 ~ 100
	WarVassalizationPlayerBalanceGrabPercent = 25
	#If false (default), a player's first colony (Primary) is protected from permanent ownership
	#transfer. Primary colonies can still be tax-occupied or vassalized (the loser pays tribute),
	#but the deed never moves. Secondary colonies are always transferable when
	#EnableColonyTransfer is on. Set true for a no-mercy SMP where even home bases can be lost.
	EnablePrimaryColonyTransfer = false
	#Tribune rule: if a colony DECLINES a vassalization offer, war automatically breaks out
	#between the offering overlord and the declining colony (the overlord becomes the
	#attacker). Requires the overlord to be online and to meet the normal war requirements;
	#otherwise the decline is peaceful. Set false to make declining always peaceful.
	EnableVassalDeclineWar = false
	#Minimum number of guards required to initiate a raid. NOTE: This is only used when 'EnableRaidBuildingRequirements' is disabled. If building requirements are enabled, they take priority over this setting.
	# Default: 3
	# Range: 1 ~ 100
	MinGuardsToRaid = 3
	#Enable raid guard protection system. When enabled, colonies must meet minimum defense requirements to be eligible for raids, protecting smaller/newer colonies from being overwhelmed.
	EnableRaidGuardProtection = true
	#Minimum number of guards a colony must have to be eligible for raids. Set to 0 to disable guard requirement. Default: 2 guards minimum.
	# Default: 2
	# Range: 0 ~ 100
	MinGuardsToBeRaided = 2
	#Minimum number of guard towers a colony must have to be eligible for raids. Set to 0 to disable guard tower requirement. Default: 1 guard tower minimum.
	# Default: 1
	# Range: 0 ~ 100
	MinGuardTowersToBeRaided = 1
	#Interval between tax transfers during raids (seconds)
	# Default: 60
	# Range: 5 ~ 3600
	RaidTaxIntervalSeconds = 60
	#Tax transfer percentages during raids (comma-separated decimals). Each tier applies at the RaidTaxIntervalSeconds interval. Keep values consistent with MaxRaidTaxPercentage.
	RaidTaxPercentages = [0.05, 0.1, 0.15, 0.25]
	#War duration (minutes)
	# Default: 120
	# Range: 1 ~ 1440
	WarDurationMinutes = 120
	#Peace proposal timeout duration (seconds). Proposals auto-expire if not accepted/declined.
	# Default: 300
	# Range: 30 ~ 3600
	PeaceProposalTimeoutSeconds = 300
	#Minimum guards required to declare war. NOTE: This is only used when 'EnableWarBuildingRequirements' is disabled. If building requirements are enabled, they take priority over this setting.
	# Default: 5
	# Range: 1 ~ 100
	MinGuardsToWageWar = 5
	#If enabled, war participants will be switched to the 'war' LP permission group during wars.
	#This requires LuckPerms to be installed and the 'war' group to be properly set up.
	#The command used is: /lp user <Player> parent set war
	EnableLPGroupSwitching = false
	#Duration of the join phase in minutes
	# Default: 5
	# Range: 1 ~ 30
	JoinPhaseDurationMinutes = 5
	#If enabled, players will keep their inventory on their last life when they die in war.
	#This allows them to continue fighting without losing their gear, and especially important when colony transfer is enabled.
	KeepInventoryOnLastLife = true
	#Number of lives each player has during a war.
	# Default: 5
	# Range: 1 ~ 100
	PlayerLivesInWar = 5
	#Actions permitted during a War. See https://ldtteam.github.io/MineColoniesAPI/com/minecolonies/api/colony/permissions/Action.html for a list of possible actions.
	#Note: GUARDS_ATTACK was removed from Minecolonies API - hostility is now controlled by Rank.isHostile()
	WarActions = ["PLACE_BLOCKS", "BREAK_BLOCKS", "TOSS_ITEM", "PICKUP_ITEM", "ATTACK_CITIZEN", "FILL_BUCKET", "SHOOT_ARROW", "RIGHTCLICK_BLOCK", "RIGHTCLICK_ENTITY", "ATTACK_ENTITY", "EXPLODE", "HURT_CITIZEN", "HURT_VISITOR", "THROW_POTION"]
	#Actions permitted during a Raid. See https://ldtteam.github.io/MineColoniesAPI/com/minecolonies/api/colony/permissions/Action.html for a list of possible actions.
	#Note: GUARDS_ATTACK was removed from Minecolonies API - hostility is now controlled by Rank.isHostile()
	RaidActions = ["TOSS_ITEM", "PICKUP_ITEM", "ATTACK_CITIZEN", "FILL_BUCKET", "SHOOT_ARROW", "RIGHTCLICK_BLOCK", "RIGHTCLICK_ENTITY", "ATTACK_ENTITY", "EXPLODE", "HURT_CITIZEN", "HURT_VISITOR", "THROW_POTION"]
	#Actions permitted during Abandoned Colony Claiming raids. See https://ldtteam.github.io/MineColoniesAPI/com/minecolonies/api/colony/permissions/Action.html for a list of possible actions.
	#Note: GUARDS_ATTACK was removed from Minecolonies API - hostility is now controlled by Rank.isHostile()
	ClaimingActions = ["PLACE_BLOCKS", "BREAK_BLOCKS", "TOSS_ITEM", "PICKUP_ITEM", "ATTACK_CITIZEN", "FILL_BUCKET", "SHOOT_ARROW", "RIGHTCLICK_BLOCK", "RIGHTCLICK_ENTITY", "ATTACK_ENTITY", "EXPLODE", "HURT_CITIZEN", "HURT_VISITOR", "THROW_POTION", "OPEN_CONTAINER"]
	#Enable the block interaction filter system during raids and wars.
	#When enabled, this system overrides ALL other protection systems to enforce blacklist/whitelist rules.
	#BLACKLIST blocks CANNOT be interacted with (highest priority - prevents griefing).
	#WHITELIST blocks CAN be interacted with (overrides normal restrictions).
	EnableBlockInteractionFilter = true
	#List of block IDs that CANNOT be interacted with during raids/wars (highest priority).
	#Format:
	#  - Specific block: 'modid:blockname' (e.g., 'minecraft:bedrock', 'minecolonies:blockhuttownhall')
	#  - Entire mod: '#modid' (e.g., '#refinedstorage', '#mekanism')
	#These blocks are completely protected and override any whitelist or permission settings.
	#Default blacklist prevents interaction with critical infrastructure blocks.
	BlockInteractionBlacklist = ["minecraft:bedrock", "minecraft:command_block", "minecraft:chain_command_block", "minecraft:repeating_command_block", "minecraft:structure_block", "minecraft:jigsaw", "minecolonies:blockhuttownhall"]
	#List of block IDs that CAN be interacted with during raids/wars.
	#Format:
	#  - Specific block: 'modid:blockname' (e.g., 'minecraft:chest', 'ironchest:iron_chest')
	#  - Entire mod: '#modid' (e.g., '#ironchest', '#sophisticatedstorage')
	#These blocks can be opened/used even during conflicts.
	#Common use: Allow looting chests and storage blocks.
	#Blacklist always takes priority over whitelist!
	BlockInteractionWhitelist = ["minecraft:chest", "minecraft:barrel", "minecraft:furnace", "minecraft:blast_furnace", "minecraft:smoker", "minecraft:dropper", "minecraft:dispenser", "minecraft:hopper"]
	#Apply block interaction filter during wars.
	#If enabled, blacklist/whitelist rules will be enforced during active wars.
	BlockFilterWars = true
	#Apply block interaction filter during raids.
	#If enabled, blacklist/whitelist rules will be enforced during active raids.
	BlockFilterRaids = true
	#Minimum number of Guard Towers to start receiving tax boost. Set to 1 so boost scales linearly from first tower (per-tower bonus).
	# Default: 1
	# Range: 1 ~ 100
	RequiredGuardTowersForBoost = 1
	#Tax boost PERCENTAGE PER Guard Tower above the minimum threshold. Applied per-tower for linear scaling (not a flat bonus). Example: 0.08 = +8% per tower, so 5 towers = +40%, 10 towers = +80% (capped at 80%).
	# Default: 0.08
	# Range: 0.0 ~ 2.0
	GuardTowerTaxBoostPercentage = 0.08

	["War Settings"."Colony Occupation"]
		#When enabled and colony transfer is enabled, winning a war puts the colony into an OCCUPIED state
		#instead of immediately transferring ownership. The occupier can collect taxes but cannot
		#interact with colony buildings or items. The original owner has a configurable number of days
		#to wage a reclamation war. If no reclamation is attempted, full ownership transfers automatically.
		EnableOccupationSystem = true
		#Number of real-time days the original owner has to reclaim an occupied colony.
		#After this period expires without a reclamation war, full ownership permanently transfers to the occupier.
		# Default: 7
		# Range: 1 ~ 90
		OccupationDurationDays = 7
		#Percentage of the occupied colony's generated tax that is diverted to the occupier (0.0 - 1.0).
		#For example, 0.5 means 50% of the colony's tax income goes to the occupier.
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		OccupationTaxPercentage = 0.5

	["War Settings"."High Stakes War"]
		#When enabled, SECONDARY colonies (outposts) can be attacked even if the owner is offline.
		#PRIMARY colonies (a player's first colony) still require the owner to be online.
		#This creates risk for empire expansion - outposts need strong passive defenses!
		EnableOutpostVulnerability = true
		#When enabled, the attacker's colony becomes a WAGER in the war.
		#If the attacker WINS: Target colony enters OCCUPIED state (attacker collects taxes).
		#If the DEFENDER WINS: Attacker's wagered colony enters OCCUPIED state (defender collects taxes)!
		#This creates high-risk, high-reward warfare where attackers cannot safely grief weaker players.
		EnableColonyWager = true

	["War Settings"."Entity Raid Settings"]
		#Enable entity-triggered raids. When disabled, entities will not trigger raids even if they meet the criteria. Admin-only feature.
		EnableEntityRaids = false
		#List of entity types that can trigger raids. Use Minecraft entity resource IDs (e.g., 'minecraft:pillager'). Default: only Pillagers.
		EntityRaidWhitelist = ["minecraft:pillager"]
		#Number of whitelisted entities near a colony required to trigger a raid
		# Default: 1
		# Range: 1 ~ 50
		EntityRaidThreshold = 1
		#Radius in blocks to detect entities around colonies for raid triggering (default: 50 blocks)
		# Default: 50
		# Range: 10 ~ 500
		EntityRaidDetectionRadius = 50
		#If true, entity raids will only send messages to colony and allies without triggering actual raid mechanics. Set to false for full raid functionality.
		EntityRaidMessageOnly = false
		#Time in seconds entities have to return to colony boundaries after leaving during an entity raid
		# Default: 5
		# Range: 1 ~ 60
		EntityRaidBoundaryTimerSeconds = 5
		#How often (in ticks) to check for entities near colonies. Lower values = more frequent checks but higher performance cost. 20 ticks = 1 second
		# Default: 20
		# Range: 10 ~ 200
		EntityRaidCheckIntervalTicks = 20
		#Cooldown period between entity raids for the same colony (minutes)
		# Default: 30
		# Range: 1 ~ 1440
		EntityRaidCooldownMinutes = 30
		#Enable detailed debug logging for EntityRaid system. When enabled, provides comprehensive logging of entity detection, filtering, and raid triggering processes.
		EnableEntityRaidDebug = false
		#Debug logging verbosity level for EntityRaid system:
		#1 = Basic (raid triggers, major events)
		#2 = Detailed (entity filtering, alliance checks)
		#3 = Verbose (all detection steps, performance metrics)
		# Default: 1
		# Range: 1 ~ 3
		EntityRaidDebugLevel = 1
		#TESTING ONLY: Bypass alliance checks to allow your own recruits to trigger raids (set to false for production)
		BypassAllianceChecks = false

	["War Settings"."PvP Kill Economy"]
		#Enable PvP kill economy system. When enabled, killing a player transfers a percentage of their balance to the killer. Compatible with SDMShop and SDMEconomy. Disabled by default.
		EnablePvPKillEconomy = false
		#Percentage of victim's balance transferred to killer on PvP kill (0.0 - 1.0). For example: 0.1 = 10% of victim's money goes to killer. Uses SDMShop balance or colony funds based on configuration.
		# Default: 0.1
		# Range: 0.0 ~ 1.0
		PvPKillRewardPercentage = 0.1

	["War Settings"."General Colony Permissions"]
		#Enable general item interactions for all players in colonies. When enabled, allows non-allies to toss items and pickup items within colony boundaries.
		EnableGeneralItemInteractions = true
		#Actions allowed for all players in colonies when general interactions are enabled. See https://ldtteam.github.io/MineColoniesAPI/com/minecolonies/api/colony/permissions/Action.html for a list of possible actions.
		GeneralColonyActions = ["TOSS_ITEM", "PICKUP_ITEM"]
		#Enable resistance effect for colony guards during raids. When enabled, guards will receive a resistance effect to help defend the colony.
		EnableGuardResistanceDuringRaids = true
		#Level of resistance effect applied to guards during raids (1-255). Higher levels provide better protection. Set to 0 to disable even if the feature is enabled.
		# Default: 2
		# Range: 0 ~ 255
		GuardResistanceLevel = 2
		#Enable happiness-based tax modifiers. When enabled, colony citizen happiness affects tax generation rates.
		EnableHappinessTaxModifier = true
		#Minimum tax multiplier for unhappy colonies (0.1 - 1.0). Lower values mean unhappy colonies generate less tax.
		# Default: 0.5
		# Range: 0.1 ~ 1.0
		HappinessTaxMultiplierMin = 0.5
		#Maximum tax multiplier for very happy colonies (1.0 - 2.0). Higher values mean happy colonies generate more tax.
		# Default: 1.5
		# Range: 1.0 ~ 2.0
		HappinessTaxMultiplierMax = 1.5
		#Enable colony inactivity tax pause system. When enabled, colonies that haven't been visited by owners/officers for the specified time will stop generating taxes.
		EnableColonyInactivityTaxPause = true
		#Hours of inactivity after which a colony will stop generating taxes. This uses MineColonies' built-in player interaction tracking.
		# Default: 168
		# Range: 1 ~ 8760
		ColonyInactivityHoursThreshold = 168
		#Enable extortion system for wars. When enabled, defenders can choose to pay extortion instead of fighting when WarAcceptanceRequired is false.
		EnableExtortionSystem = true
		#Default extortion percentage when not specified by attacker (0.0 - 1.0). For example: 0.15 = 15% of defender's balance.
		# Default: 0.15
		# Range: 0.0 ~ 1.0
		DefaultExtortionPercentage = 0.15
		#Time limit in minutes for defenders to respond to extortion offers before war automatically starts.
		# Default: 5
		# Range: 1 ~ 30
		ExtortionResponseTimeMinutes = 5
		#Hours of immunity from new extortion attempts after successfully paying extortion.
		# Default: 24
		# Range: 1 ~ 168
		ExtortionImmunityHours = 24
		#Enable citizen militia system during raids. When enabled, citizens will temporarily become guards to defend the colony. Set to false to use the old raid system.
		EnableCitizenMilitia = true
		#Percentage of eligible citizens to convert to militia guards during raids (0.0 - 1.0). For example: 0.3 = 30% of citizens become militia.
		# Default: 0.3
		# Range: 0.0 ~ 1.0
		MilitiaConversionPercentage = 0.3
		#Minimum level required for a citizen to be eligible for militia conversion. Higher levels = more experienced citizens only.
		# Default: 3
		# Range: 1 ~ 99
		MilitiaMinCitizenLevel = 3
		#If true, militia guards and regular guards will actively seek out and engage raiders instead of just defending their posts.
		MilitiaGuardsSeekRaiders = true
		#If true, raiders steal tax based on guards killed. If false, uses the old time-based tax stealing system.
		TaxStealPerGuardKilled = true
		#Percentage of colony tax stolen per guard/militia killed during a raid (0.0 - 1.0). For example: 0.1 = 10% tax stolen per guard killed.
		# Default: 0.1
		# Range: 0.0 ~ 1.0
		TaxStealPercentagePerGuard = 0.1
		#Maximum percentage of colony tax that can be stolen during a raid (0.0 - 1.0). This amount is distributed across all guards/militia. For example: 0.25 = 25% max tax stolen when all defenders are killed.
		# Default: 0.25
		# Range: 0.0 ~ 1.0
		MaxRaidTaxPercentage = 0.25
		#If true, resistance effects during raids/wars will also be applied to all citizens, not just guards. This makes the entire colony more defensive.
		ApplyResistanceToCitizens = false

	["War Settings"."Colony Auto-Abandon"]
		#MASTER SWITCH for the colony abandonment system (default FALSE). When FALSE, the mod performs NO automatic writes to MineColonies owner/permission state — no auto-abandon, no debt-bankruptcy abandonment, no null-owner repair, no abandoned-entry cleanup. This is the 4.x/5.0 world-brick safeguard: leave it OFF unless you specifically want automatic colony abandonment. EnableColonyAutoAbandon below only takes effect when this is TRUE.
		EnableColonyAbandonmentSystem = false
		#Enable automatic colony abandonment when owners/officers haven't visited for the configured time. When enabled, colonies will be automatically abandoned and can be claimed by other players.
		EnableColonyAutoAbandon = true
		#Days of inactivity after which a colony will be automatically abandoned. This is measured by the last time any owner or officer visited the colony. Default: 14 days (2 weeks)
		# Default: 14
		# Range: 1 ~ 365
		ColonyAutoAbandonDays = 14
		#If true, owners and officers will be notified before their colony is abandoned. Requires warning days to be configured.
		NotifyOwnersBeforeAbandon = true
		#Days before abandonment to warn owners and officers. Warnings are sent when they log in during this period.
		# Default: 3
		# Range: 1 ~ 30
		AbandonWarningDays = 3
		#Allow ALL players to use /wnt listabandoned command.
		#When FALSE (default): Only OPs (permission level 2+) can view abandoned colonies.
		#When TRUE: Any player can view the list of abandoned colonies available for claiming.
		EnableListAbandonedForAll = false
		#EXPERIMENTAL: Reset abandonment timer when officers/owners log into the server.
		#When FALSE (default): Timer only resets when officers PHYSICALLY VISIT the colony (chunk-based detection).
		#When TRUE: Timer resets for ALL colonies an officer manages just by logging in (easier but defeats the purpose).
		#
		#RECOMMENDED: Keep this FALSE to ensure officers actually visit their colonies to prevent abandonment.
		#Setting this to TRUE will prevent colonies from ever being abandoned if officers log in regularly.
		ResetTimerOnOfficerLogin = false

	["War Settings"."Abandoned Colony Claiming"]
		#Enable claiming of abandoned colonies using the /wnt claimcolony command. When enabled, players can claim abandoned colonies, triggering a raid where all citizens become hostile militia.
		EnableAbandonedColonyClaiming = true
		#Minimum number of guards required to claim an abandoned colony. This ensures only established colonies can claim others.
		# Default: 3
		# Range: 1 ~ 50
		MinGuardsForClaimingRaid = 3
		#Let a player who owns NO colony yet claim an abandoned colony as their first home, bypassing the guard and building requirements (they have no colony to meet them). Off by default; enable it if you want newcomers to be able to take over an abandoned colony they find. Players who already own a colony still need the normal requirements.
		AllowColonylessClaimingRaid = false
		#Duration in minutes for the claiming raid when taking over an abandoned colony. During this time, all citizens will be hostile and attack the claiming player.
		# Default: 5
		# Range: 1 ~ 60
		ClaimingRaidDurationMinutes = 5
		#Grace period in hours before a player can claim another colony. This prevents players from claiming multiple colonies in quick succession.
		# Default: 24
		# Range: 1 ~ 168
		ClaimingGracePeriodHours = 24
		#If true, spawn mercenaries to defend the colony during claiming if there are fewer than 5 citizens/guards. This ensures abandoned colonies still put up a fight when being claimed.
		SpawnMercenariesIfLowDefenders = true
		#Building requirements to claim abandoned colonies. Format: 'building:level,building:level'. Example: 'townhall:2,guardtower:1' means player needs townhall level 2+ and at least one guard tower to claim. Leave empty to disable building requirements.
		ClaimingBuildingRequirements = "townhall:2"

	["War Settings"."Raid Building Requirements"]
		#Enable building requirements for initiating raids. When enabled, these requirements take PRIORITY over 'MinGuardsToRaid' setting. Disable this to use the legacy guard count system instead.
		EnableRaidBuildingRequirements = true
		#Building requirements to initiate raids. Format: 'building:level:amount,building:level:amount'. Example: 'townhall:1:1,guardtower:1:3' means player needs 1 townhall level 1+ and 3 guard towers level 1+ to raid. NOTE: When this is enabled, it replaces the 'MinGuardsToRaid' requirement entirely. Leave empty to disable building requirements.
		RaidBuildingRequirements = "townhall:1:1,guardtower:1:3"

	["War Settings"."War Building Requirements"]
