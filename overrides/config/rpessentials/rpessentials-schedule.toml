["Schedule System"]
	#Enable the schedule system.
	#When false, the server is always considered open.
	enableSchedule = false
	#If true, non-staff players are kicked when the server closes.
	kickNonStaff = true
	#Minutes before closing at which warning messages are sent.
	#Example: [30, 15, 5, 1]
	warningTimes = [30, 15, 5, 1]

	[Days.MONDAY]
		#Is Monday an open day?
		enabled = true
		#Opening time (HH:MM).
		open = "19:00"
		#Closing time (HH:MM). Supports cross-midnight, e.g. 02:00.
		close = "23:59"

	[Days.TUESDAY]
		#Is Tuesday an open day?
		enabled = true
		#Opening time (HH:MM).
		open = "19:00"
		#Closing time (HH:MM).
		close = "23:59"

	[Days.WEDNESDAY]
		#Is Wednesday an open day?
		enabled = true
		#Opening time (HH:MM).
		open = "19:00"
		#Closing time (HH:MM).
		close = "23:59"

	[Days.THURSDAY]
		#Is Thursday an open day?
		enabled = true
		#Opening time (HH:MM).
		open = "19:00"
		#Closing time (HH:MM).
		close = "23:59"

	[Days.FRIDAY]
		#Is Friday an open day?
		enabled = true
		#Opening time (HH:MM).
		open = "19:00"
		#Closing time (HH:MM).
		close = "23:59"

	[Days.SATURDAY]
		#Is Saturday an open day?
		enabled = false
		#Opening time (HH:MM).
		open = "15:00"
		#Closing time (HH:MM).
		close = "23:59"

	[Days.SUNDAY]
		#Is Sunday an open day?
		enabled = false
		#Opening time (HH:MM).
		open = "15:00"
		#Closing time (HH:MM).
		close = "23:59"

["Schedule Messages"]
	#Message sent to players when the server closes or they try to join outside hours.
	#Placeholders: {open} {close} {day}
	msgServerClosed = "§c§lThe server is now closed. See you on {day} at {open}!"
	#Message broadcast when the server opens.
	#Placeholders: {open} {close} {day}
	msgServerOpened = "§a§lThe server is now open! Closing at {close}. Welcome!"
	#Warning message sent before closing.
	#Placeholders: {minutes} {close}
	msgWarning = "§e§lWarning: §r§eThe server closes in §c{minutes} minutes §e(at {close})."
	#Last warning message (1 minute before closing).
	#Placeholders: {minutes} {close}
	msgClosingImminent = "§c§lThe server closes in {minutes} minute(s)! Finish what you're doing!"

["Forced State"]
	#Forced server state. NONE = follow schedule, FORCE_OPEN = always open, FORCE_CLOSED = always closed.
	#Managed by /opennow and /closenow. Do not edit manually while the server is running.
	forceState = "NONE"
	#Message shown to non-staff players trying to connect when the server is forcibly closed.
	#Supports & and § color codes.
	forceClosedMessage = "§c§lThe server is exceptionally closed. Please check back later."
	#Players in this list can connect even when the server is forcibly or schedule-closed.
	#Also bypasses FORCE_CLOSED. Staff members are always exempt regardless of this list.
	scheduleWhitelist = []

["Welcome Message"]
	#Enable the welcome message on player join.
	enableWelcome = true
	#Lines of the welcome message. Supports & and § color codes.
	#Placeholders: {player}, {nickname}
	welcomeLines = ["§6§m------------------------------------", "§e§lWelcome to the server, {player}!", "§7Enjoy your stay.", "§6§m------------------------------------"]
	#Sound played on join. Use a Minecraft sound ID.
	#Set to '' to disable.
	welcomeSound = "minecraft:ui.toast.challenge_complete"
	#Welcome sound volume.
	# Default: 1.0
	# Range: 0.0 ~ 10.0
	welcomeSoundVolume = 1.0
	#Welcome sound pitch.
	# Default: 1.0
	# Range: 0.5 ~ 2.0
	welcomeSoundPitch = 1.0

["Death Hours"]
	#If true, RP death is only active during the configured time slots.
	#When false, death RP follows only the manual toggle (existing behaviour).
	deathHoursEnabled = false
	#Time slots during which RP death is active. Format: HH:MM-HH:MM.
	#Supports cross-midnight. Example: ["22:00-23:59", "00:00-06:00"]
	deathHoursSlots = ["22:00-23:59"]

["HRP Hours"]
	#Enable HRP (out-of-roleplay) hour management.
	#When false, this section is completely ignored.
	enableHrpHours = false
	#Slots where HRP is tolerated (noted but not punished). Format: HH:MM-HH:MM.
	hrpToleratedSlots = ["21:00-22:00"]
	#Slots where HRP is fully allowed. Format: HH:MM-HH:MM.
	hrpAllowedSlots = ["22:00-23:59"]
	#Message broadcast when HRP-tolerated hours begin. Placeholders: {start} {end}
	hrpToleratedMessage = "§6[HRP] §fHRP is tolerated until {end}."
	#Message broadcast when HRP-allowed hours begin. Placeholders: {start} {end}
	hrpAllowedMessage = "§a[HRP] §fHRP is freely allowed until {end}."
	#Display mode for HRP messages: CHAT, ACTION_BAR, TITLE, IMMERSIVE.
	hrpMessageMode = "CHAT"
