		"Enchantment Value" = -1
		#Explosion resistance (0-1000). JSON default: 4.
		# Default: -1
		# Range: -1 ~ 1000
		Resistance = -1
		#Lock pick durability a wrong pin costs on this lock (1-1000). JSON default: 1.
		# Default: -1
		# Range: -1 ~ 1000
